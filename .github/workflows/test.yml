name: test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test ./...
      - run: go test ./...
        env:
          GOEXPERIMENT: simd
      - run: go test ./...
        env:
          GOEXPERIMENT: simd
          GODEBUG: simd=0
      - run: go test -race ./...
        env:
          GOEXPERIMENT: simd
      - run: go vet ./...
        env:
          GOEXPERIMENT: simd
      - run: go test -run '^$' -fuzz FuzzTree -fuzztime 20s
        env:
          GOEXPERIMENT: simd
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path internal/oracle/Cargo.toml
      - run: GOBBTREE_ORACLE="$PWD/internal/oracle/target/release/gobbtree-oracle" go test -run TestUpstreamOracle -v
        env:
          GOEXPERIMENT: simd
