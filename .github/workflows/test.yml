name: test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test ./...
      - run: go test ./...
        env:
          GOEXPERIMENT: simd
      - run: go test ./...
        env:
          GOEXPERIMENT: simd
          GODEBUG: simd=0
      - run: go test -race ./...
        env:
          GOEXPERIMENT: simd
      - run: go vet ./...
        env:
          GOEXPERIMENT: simd
      - run: go test -run '^$' -fuzz FuzzTree -fuzztime 20s
        env:
          GOEXPERIMENT: simd
      - run: go test -run '^$' -fuzz FuzzFileMap -fuzztime 20s
        env:
          GOEXPERIMENT: simd
      - run: go test -run '^$' -fuzz FuzzFileBytes -fuzztime 20s
        env:
          GOEXPERIMENT: simd
      - run: go test -run '^$' -fuzz FuzzRecord -fuzztime 20s ./store/wal
      - run: go test -run '^$' -fuzz FuzzScan -fuzztime 20s ./store/wal
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark checksums
        run: python3 -m unittest discover -s internal -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path internal/oracle/Cargo.toml
      - run: GOBBTREE_ORACLE="$PWD/internal/oracle/target/release/gobbtree-oracle" GOBBTREE_FILE_ORACLE="$PWD/internal/oracle/target/release/file-oracle" go test -run 'TestUpstream.*Oracle' -v
        env:
          GOEXPERIMENT: simd
      - run: GOBBTREE_WAL_ORACLE="$PWD/internal/oracle/target/release/wal-oracle" go test ./store/wal -run 'TestUpstreamWALOracle' -v
