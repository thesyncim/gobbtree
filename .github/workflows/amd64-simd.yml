name: amd64 SIMD
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: amd64-simd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOEXPERIMENT: simd
      GOAMD64: v1
      RUSTFLAGS: -C target-cpu=native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: CPU and selected backend
        run: |
          mkdir -p perf
          lscpu > perf/cpu.txt
          go version
          go test -run TestSIMDAMD64Dispatch -v > perf/backend.txt
          cat perf/backend.txt
      - name: Native selected ISA
        run: go test -race ./...
      - name: AVX2 dispatch
        env:
          GODEBUG: cpu.avx512f=off
          GOBBTREE_EXPECT_WIDTH: '256'
        run: go test -v ./... > perf/avx2-tests.txt
      - name: 128-bit fallback
        env:
          GODEBUG: cpu.avx512f=off,cpu.avx2=off
          GOBBTREE_EXPECT_WIDTH: '128'
        run: go test -v ./... > perf/avx-tests.txt
      - name: Explicit 128-bit width
        env:
          GODEBUG: simd=128
          GOBBTREE_EXPECT_WIDTH: '128'
        run: go test -v ./... > perf/explicit-width-tests.txt
      - name: Emulated fallback
        env:
          GODEBUG: simd=0
          GOBBTREE_EXPECT_WIDTH: '0'
        run: go test -v ./... > perf/scalar-tests.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Build comparison programs
        run: |
          git worktree add ../simd-baseline 347bf1e1be23d08936f3ece8dc93b2501f8534ce
          cp cmd/compare/main.go ../simd-baseline/cmd/compare/main.go
          cp standard_benchmark_test.go mutation_benchmark_test.go ../simd-baseline/
          (cd ../simd-baseline && go build -o ../compare-baseline ./cmd/compare && go build -o ../memory-baseline ./cmd/memory)
          git rev-parse HEAD > perf/go-source.txt
          git -C ../simd-baseline rev-parse HEAD > perf/baseline-source.txt
          go build -o ../compare-current ./cmd/compare
          go build -o ../memory-current ./cmd/memory
          rustc -vV > perf/rust-version.txt
          cargo build --release --locked --manifest-path internal/oracle/Cargo.toml --bin compare --bin memory
          go test -c -o ../simd.test
          go tool objdump -s 'gobbtree.(lowerCode|lowerCompact|findCode|firstTag|upperTag|firstSharedTag|upperSharedTag|upperWordInline|mask16Count128|mask16Count256|diskCount16|diskCount32|diskCount64)$' ../simd.test > perf/generated-code.txt
      - name: Compare public operations on the same CPU
        run: |
          for size in 4096 262144; do
            python3 internal/cpu_compare.py --go ../compare-current --baseline ../compare-baseline --rust internal/oracle/target/release/compare --size "$size" --queries 8192 --rounds 512 --threads 4 --repeat 3 --standard > "perf/compare-$size.jsonl"
          done
          go test -run '^$' -bench 'BenchmarkLookup|BenchmarkMutation|BenchmarkBuild|BenchmarkParallelGet' -benchtime=200ms -count=3 >> perf/public-bench.txt
          go test -run '^$' -bench BenchmarkConcurrentMaps -cpu=4 -benchtime=250ms -count=3 > perf/standard-maps.txt
          (cd ../simd-baseline && go test -run '^$' -bench 'BenchmarkMutation|BenchmarkBuild|BenchmarkConcurrentMaps/(4096|262144)/write10/^Map$' -cpu=4 -benchtime=200ms -count=3) > perf/baseline-writes.txt
      - name: Compare replacements and key churn
        run: python3 internal/cpu_compare.py --go ../compare-current --baseline ../compare-baseline --rust internal/oracle/target/release/compare --size 262144 --queries 8192 --rounds 32 --threads 0 --repeat 3 --standard --mutations --distinct > perf/mutations.jsonl
      - name: Compare five million entries
        run: |
          python3 internal/cpu_compare.py --go ../compare-current --baseline ../compare-baseline --rust internal/oracle/target/release/compare --size 5000000 --queries 1048576 --rounds 4 --threads 4 --repeat 3 --standard --mutations --distinct > perf/five-million.jsonl
      - name: Compare fifty million entries
        run: |
          python3 internal/cpu_compare.py --go ../compare-current --baseline ../compare-baseline --rust internal/oracle/target/release/compare --size 50000000 --queries 1048576 --rounds 4 --threads 4 --repeat 3 --mutations --distinct > perf/fifty-million.jsonl
          python3 internal/rss_compare.py --go ../memory-current --baseline ../memory-baseline --rust internal/oracle/target/release/memory --size 50000000 --repeat 3 --kinds tree map > perf/memory-fifty-million.jsonl
      - name: Compare process memory
        run: python3 internal/rss_compare.py --go ../memory-current --rust internal/oracle/target/release/memory > perf/memory.jsonl
      - name: Compare AVX2 and selected width
        run: |
          for repeat in 1 2 3; do
            echo "repeat=$repeat forced AVX2" >> perf/widths.txt
            GODEBUG=cpu.avx512f=off ../compare-current -size 262144 -rounds 512 -threads 4 >> perf/widths.txt
            echo "repeat=$repeat selected" >> perf/widths.txt
            ../compare-current -size 262144 -rounds 512 -threads 4 >> perf/widths.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amd64-${{ matrix.os }}
          path: perf/
